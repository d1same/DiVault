services:
  notes:
    build: .
    container_name: divault-notes
    ports:
      - "${DIVAULT_BIND:-127.0.0.1}:${APP_PORT:-3443}:3443"
    volumes:
      - ./config:/config
      # Optional external Drive storage. Set DRIVE_FILES_DIR=/media in Settings or env to use it.
      - ${DIVAULT_MEDIA_PATH:-./config/drive-files}:/media
    environment:
      APP_URL: "https://notes.example.com"
      APP_CONFIG_DIR: "/config"
      DRIVE_FILES_DIR: "${DRIVE_FILES_DIR:-}"
      DRIVE_UPLOAD_MAX_MB: "${DRIVE_UPLOAD_MAX_MB:-}"
      ONLYOFFICE_URL: "${ONLYOFFICE_URL:-}"
      ONLYOFFICE_PUBLIC_URL: "${ONLYOFFICE_PUBLIC_URL:-}"
      ONLYOFFICE_CALLBACK_BASE_URL: "${ONLYOFFICE_CALLBACK_BASE_URL:-}"
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      SECURE_COOKIES: "${SECURE_COOKIES:-false}"
      PUID: "${PUID:-}"
      PGID: "${PGID:-}"
      SKIP_CONFIG_CHOWN: "${SKIP_CONFIG_CHOWN:-false}"
      DIVAULT_CHOWN_MEDIA: "${DIVAULT_CHOWN_MEDIA:-false}"
      DIVAULT_LOG_LEVEL: "${DIVAULT_LOG_LEVEL:-info}"
      AI_REVIEW_API_TOKEN: ${AI_REVIEW_API_TOKEN:-}
      AI_REVIEW_USER_EMAIL: "${AI_REVIEW_USER_EMAIL:-}"
      ASSISTANT_API_TOKEN: ${ASSISTANT_API_TOKEN:-}
      ASSISTANT_USER_EMAIL: "${ASSISTANT_USER_EMAIL:-}"
      TZ: "America/New_York"
    restart: unless-stopped
