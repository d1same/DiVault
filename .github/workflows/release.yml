name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows-desktop-release:
    name: Build Windows desktop installers
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, zip

      - name: Install dependencies
        run: npm ci

      - name: Build desktop installers
        run: npm run desktop:build

      - name: Smoke test desktop executable
        shell: pwsh
        run: ./scripts/desktop-smoke.ps1

      - name: Upload installers to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --verify-tag --generate-notes
          }
          gh release upload $env:GITHUB_REF_NAME --clobber `
            src-tauri/target/release/bundle/msi/*.msi `
            src-tauri/target/release/bundle/nsis/*.exe

  android-release:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: windows-desktop-release
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build Android debug APK
        working-directory: android
        run: gradle assembleDebug lintDebug --no-daemon

      - name: Upload Android APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "DiVault_${GITHUB_REF_NAME}_android-debug.apk"
          gh release upload "$GITHUB_REF_NAME" --clobber "DiVault_${GITHUB_REF_NAME}_android-debug.apk"

  docker-release:
    name: Publish Docker release image
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            --tag ghcr.io/d1same/divault:latest \
            --tag ghcr.io/d1same/divault:${{ github.ref_name }} \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/d1same/divault:latest
          docker push ghcr.io/d1same/divault:${{ github.ref_name }}
