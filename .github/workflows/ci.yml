name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write

jobs:
  web-docker:
    name: Web and Docker smoke
    runs-on: ubuntu-latest
    env:
      AI_REVIEW_API_TOKEN: ci-ai-review-token
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/sw.js

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build and start Docker app
        run: docker compose up -d --build --force-recreate --remove-orphans

      - name: Wait for container health
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddSeconds(90)
          do {
            $status = docker inspect --format '{{.State.Health.Status}}' divault-notes
            if ($status -eq 'healthy') { 'healthy'; exit 0 }
            Start-Sleep -Seconds 2
          } while ((Get-Date) -lt $deadline)
          throw "Container did not become healthy. Last status: $status"

      - name: Run API smoke suite
        shell: pwsh
        run: ./scripts/smoke.ps1

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Docker app
        if: always()
        run: docker compose down -v --remove-orphans

  desktop-windows:
    name: Windows desktop build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, zip

      - name: Install dependencies
        run: npm ci

      - name: Prepare desktop runtime
        shell: pwsh
        run: ./scripts/prepare-desktop-runtime.ps1

      - name: Check Rust build
        working-directory: src-tauri
        run: cargo check

      - name: Build desktop installers
        run: npm run desktop:build

      - name: Smoke test desktop executable
        shell: pwsh
        run: ./scripts/desktop-smoke.ps1

      - name: Upload desktop installers
        uses: actions/upload-artifact@v7
        with:
          name: divault-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  android:
    name: Android APK build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug lintDebug --no-daemon

      - name: Validate unsigned Android release build
        working-directory: android
        run: ./gradlew assembleRelease lintRelease --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: divault-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  publish-docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: [web-docker, desktop-windows, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Docker image
        run: |
          IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${IMAGE_OWNER}/divault"
          docker build \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${{ github.sha }}" \
            .

      - name: Push Docker image
        run: |
          IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${IMAGE_OWNER}/divault"
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.sha }}"
