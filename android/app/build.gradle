plugins {
    id 'com.android.application'
}

def hasReleaseSigning = System.getenv('DIVAULT_ANDROID_KEYSTORE') &&
        System.getenv('DIVAULT_ANDROID_KEYSTORE_PASSWORD') &&
        System.getenv('DIVAULT_ANDROID_KEY_ALIAS') &&
        System.getenv('DIVAULT_ANDROID_KEY_PASSWORD')

android {
    namespace 'com.divault.mobile'
    compileSdk 35

    signingConfigs {
        release {
            def storeFilePath = System.getenv('DIVAULT_ANDROID_KEYSTORE')
            def storePasswordValue = System.getenv('DIVAULT_ANDROID_KEYSTORE_PASSWORD')
            def keyAliasValue = System.getenv('DIVAULT_ANDROID_KEY_ALIAS')
            def keyPasswordValue = System.getenv('DIVAULT_ANDROID_KEY_PASSWORD')

            if (storeFilePath && storePasswordValue && keyAliasValue && keyPasswordValue) {
                storeFile file(storeFilePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    defaultConfig {
        applicationId 'com.divault.mobile'
        minSdk 23
        targetSdk 35
        versionCode 23
        versionName '1.0.5'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
}
